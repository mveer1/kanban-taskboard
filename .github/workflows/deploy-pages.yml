name: Deploy to GitHub Pages

# Builds the Firebase-backed static bundle and publishes it to GitHub Pages.
#
# Setup, once per repository (see DEPLOYMENT.md for detail):
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → add the six
#      FIREBASE_* secrets listed below
#   3. Settings → Secrets and variables → Actions → Variables → add
#      BASE_PATH = /kanban-taskboard/   (only if the repo name differs)
#
# The Firebase web config is not sensitive — it ships in the bundle by design and
# is guarded by firestore.rules. Secrets are used anyway so the values are not
# committed and can be rotated or repointed without a code change.

on:
  push:
    branches: [main]
  # Manual runs, e.g. to redeploy after changing a secret.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it — a cancelled
# deploy can leave Pages serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check Firebase secrets are set
        # A build with missing credentials deploys cleanly and then shows the
        # setup screen to every visitor. Catch it before building rather than
        # inspecting the bundle afterwards — an unset secret becomes an empty
        # string, which leaves no placeholder text to grep for.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          missing=""
          for name in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            value="${!name}"
            case "$value" in
              "" | REPLACE_WITH*) missing="$missing $name" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or placeholder Firebase secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions. See DEPLOYMENT.md §4.1."
            exit 1
          fi
          echo "All required Firebase secrets are present."

      - name: Build
        env:
          # Firebase backend: Pages cannot host the Express API.
          VITE_DATA_BACKEND: firebase
          # Pages serves from https://<user>.github.io/<repo>/, so assets need
          # that prefix. Override with a BASE_PATH repo variable if the repo is
          # named something else, or set it to / for a custom domain at the root.
          VITE_BASE: ${{ vars.BASE_PATH || '/kanban-taskboard/' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build

      - name: Verify the built bundle is configured
        # Belt and braces: confirm the project id actually made it into the
        # bundle, so a typo in a secret name cannot ship a dead build.
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if ! grep -rqF "$FIREBASE_PROJECT_ID" dist/assets; then
            echo "::error::The built bundle does not contain the Firebase project id."
            exit 1
          fi
          echo "Bundle is configured for project $FIREBASE_PROJECT_ID."

      - name: Add Pages fallbacks
        # .nojekyll stops Pages from discarding files that start with an
        # underscore. 404.html makes a deep link resolve to the app rather than
        # to a GitHub error page.
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
