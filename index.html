<!DOCTYPE html>
<html lang="en" data-theme="dark" data-radius="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Board</title>
    <meta
      name="description"
      content="A three-tier task board — projects, stories, and tasks — with dependencies, progress metrics, and shared workspaces."
    />

    <!-- Matches --bg in src/styles/tokens.css, so the browser chrome and the
         first paint agree instead of flashing white. -->
    <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Inline SVG rather than a file, so there is one less asset and nothing to
         resolve against the Pages base path. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0e10'/%3E%3Crect x='6' y='8' width='5' height='16' rx='1.5' fill='%2393c5fd'/%3E%3Crect x='13.5' y='8' width='5' height='11' rx='1.5' fill='%23fcd34d'/%3E%3Crect x='21' y='8' width='5' height='7' rx='1.5' fill='%236ee7b7'/%3E%3C/svg%3E"
    />

    <!-- The app is private per account; there is nothing to index. -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
